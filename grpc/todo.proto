syntax = "proto3";

package todoPackage;

service Todo {
    rpc createTodo(TodoItem) returns (TodoItem);
    rpc readTodos(voidNoParams) returns (TodoItems); 
    rpc streamTodos(voidNoParams) returns(stream TodoItems);
} 

// This is your defined message type
message voidNoParams {}

message TodoItem {
    int32 id = 1;
    string text = 2;
}

message TodoItems {
   repeated TodoItem items = 1; 
}